---
# Global variables for MXCubeWeb deployment

service_user: "{{ lookup('env', 'USER') }}"

install_base_path: "/opt/mxcube"

mxcubeweb_config:
  port: 8081
  host: "0.0.0.0"
  debug: false

  secret_key: "7fc54a117f2ab845a4a5fbedae559add640039b01ad7ec11178b94313e3fb51b"
  security_password_salt: "08d52a8a32a2e5995ee2e0c37084b18390a61c6284d9569453df428800f53be5"

  user_db_path: "/tmp/mxcube-user.db"
  permanent_session_lifetime: 60

  cert: "NONE"
  cert_pem: ""             
  cert_key: ""            
  local_cert_pem: ""       
  local_cert_key: ""       

  external_url: "https://id30a2.mxcube.esrf.fr"
  allowed_cors_origins:
    - "https://id30a2.mxcube.esrf.fr"

mxcubeweb_sso:
  use_sso: true
  issuer: "https://websso.esrf.fr/realms/ESRF/"
  logout_uri: "https://websso.esrf.fr/realms/ESRF/protocol/openid-connect/logout"
  token_info_uri: "https://websso.esrf.fr/realms/ESRF/protocol/openid-connect/token"
  meta_data_uri: "https://websso.esrf.fr/realms/ESRF/.well-known/openid-configuration"
  client_id: "mxcube"
  client_secret: "DoCKb0rnxbDZX3YrueQp2yr9nd0Qdcbn"
  scope: "openid email profile"
  code_challenge_method: "S256"

mxcubeweb_users:
  - username: "user"
    role: "staff"

conda_environments:
  mxcube:
    conda_packages:
      - nodejs==20.*
      - pnpm==9.*
      - poetry==2.1.3
      - openldap
      - ffmpeg
    pip_packages:
      - gunicorn
      - gevent
      - blissclient
      - marshmallow  
      - aiohttp
      - pyicat_plus

# Set use_local_repos to true to copy from local paths instead of cloning from GitHub
use_local_repos: true

# GitHub repositories (used when use_local_repos is false)
mxcubecore_repo: "https://github.com/mxcube/mxcubecore.git"
mxcubecore_version: "develop"

mxcubeweb_repo: "https://github.com/mxcube/mxcubeweb.git"
mxcubeweb_version: "develop"

# Local repository paths (used when use_local_repos is true)
local_mxcubecore_path: "../../../mxcubecore"
local_mxcubeweb_path: "../../../"
local_bliss_path: "../../../bliss"

# Bliss repository (used when use_local_repos is false)
bliss_repo: "https://gitlab.esrf.fr/bliss/bliss.git"
bliss_version: "master"

# Docker images URLs for downloading pre-built images
arinax_docker_image_url: "https://cloud.esrf.fr/public.php/dav/files/7qtFP5iP9jiPB2M"
flex_docker_image_url: "https://cloud.esrf.fr/public.php/dav/files/iAdyarEZmL9odxJ"